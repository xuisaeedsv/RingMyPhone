name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: نصب Android SDK
        uses: android-actions/setup-android@v3

      - name: دادن دسترسی اجرا به gradlew
        run: |
          test -f gradlew || gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: بیلد نسخه Debug
        run: ./gradlew assembleDebug

      - name: آپلود فایل APK
        uses: actions/upload-artifact@v4
        with:
          name: RingMyPhone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
